spring:
  application:
    name: NEO-ENERGY

  datasource:
    # Valores vêm de variáveis de ambiente. Os defaults (após :) servem só pra rodar local.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neoenergy}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NeoEnergyHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
    open-in-view: false

server:
  # Render injeta a porta na env var PORT. Local cai no default 8080.
  port: ${PORT:8080}

app:
  jwt:
    # Em produção, defina APP_JWT_SECRET (base64 de 32+ bytes: openssl rand -base64 32).
    # O default abaixo é só pra desenvolvimento local.
    secret: ${APP_JWT_SECRET:Y2hhbmdlLW1lLXBsZWFzZS10aGlzLWlzLWEtZGVmYXVsdC1zZWNyZXQtZm9yLW5lby1lbmVyZ3k=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}   # 24h — duração do access token (JWT)
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}   # 7 dias — refresh token
    issuer: ${APP_JWT_ISSUER:neo-energy}
