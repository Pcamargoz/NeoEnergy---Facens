spring:
  application:
    name: NEO-ENERGY

  datasource:
    url: jdbc:postgresql://localhost:5432/neoenergy
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NeoEnergyHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
    open-in-view: false

server:
  port: 8080

app:
  jwt:
    # base64 de 32+ bytes. Troque por um valor secreto real (use openssl rand -base64 32)
    secret: Y2hhbmdlLW1lLXBsZWFzZS10aGlzLWlzLWEtZGVmYXVsdC1zZWNyZXQtZm9yLW5lby1lbmVyZ3k=
    expiration-ms: 86400000   # 24h — duração do access token (JWT)
    refresh-expiration-ms: 604800000   # 7 dias — duração do refresh token
    issuer: neo-energy
